<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected Speech Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #070b12;
  --bg2:     #0f1520;
  --bg3:     #18202e;
  --bg4:     #1f2a3c;
  --accent:  #00d4ff;
  --accent2: #ffd60a;
  --accent3: #ff6b6b;
  --green:   #3ddc84;
  --text:    #e8edf5;
  --text2:   #7a8ba3;
  --border:  #1e2d42;
  --radius:  14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── PASSWORD SCREEN ── */
#password-screen {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.pw-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 22px; padding: 40px 36px 36px;
  width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  text-align: center; position: relative; overflow: hidden;
}
.pw-box::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
}
.pw-icon { font-size: 3rem; margin-bottom: 12px; }
.pw-title {
  font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 800;
  color: var(--text); margin-bottom: 6px; letter-spacing: 1px;
}
.pw-title span { color: var(--accent); }
.pw-sub { color: var(--text2); font-size: 0.85rem; margin-bottom: 28px; }
.pw-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }
.pw-input {
  width: 100%; padding: 14px 18px;
  background: var(--bg3); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-family: 'Syne', sans-serif; font-size: 1.3rem;
  letter-spacing: 4px; text-align: center;
  outline: none; transition: border-color 0.2s; margin-bottom: 16px;
}
.pw-input:focus { border-color: var(--accent); }
.pw-input.shake { animation: shake 0.4s ease; border-color: var(--accent3) !important; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
.pw-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 12px;
  font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.pw-btn:hover { opacity: .9; transform: translateY(-1px); }
.pw-btn:active { transform: translateY(0); }
.pw-error { margin-top: 14px; font-size: 0.82rem; font-weight: 600; color: var(--accent3); min-height: 20px; }

/* ── APP ── */
#app { display: none; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

#home { padding: 32px 20px 40px; max-width: 720px; margin: 0 auto; width: 100%; }
.home-header { text-align: center; margin-bottom: 36px; }
.logo-tag { display: inline-block; background: var(--accent); color: var(--bg); font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; margin-bottom: 14px; }
.home-title { font-family: 'Syne', sans-serif; font-size: clamp(28px, 6vw, 46px); font-weight: 800; line-height: 1.1; color: var(--text); margin-bottom: 10px; }
.home-title span { color: var(--accent); }
.home-sub { color: var(--text2); font-size: 15px; line-height: 1.6; }
.section-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--text2); text-transform: uppercase; margin-bottom: 14px; }
.stages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stage-card { background: var(--bg2); border: 2px solid var(--border); border-radius: var(--radius); padding: 18px 16px; cursor: pointer; transition: all .22s; position: relative; overflow: hidden; }
.stage-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-color, var(--accent)); }
.stage-card:hover { border-color: var(--card-color, var(--accent)); transform: translateY(-2px); background: var(--bg3); }
.stage-card.locked { opacity: .45; cursor: not-allowed; }
.stage-card.locked:hover { transform: none; border-color: var(--border); background: var(--bg2); }
.stage-card.completed::after { content: '✓'; position: absolute; top: 10px; right: 12px; color: var(--green); font-weight: 700; font-size: 14px; }
.stage-num { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--card-color, var(--accent)); margin-bottom: 4px; }
.stage-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.stage-desc { font-size: 12px; color: var(--text2); line-height: 1.4; }
.stage-lock { position: absolute; top: 10px; right: 12px; font-size: 13px; color: var(--text2); }
.quiz-btn { width: 100%; padding: 16px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent2) 0%, #ff9500 100%); color: var(--bg); border: none; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity .2s; letter-spacing: .5px; }
.quiz-btn:hover { opacity: .9; }
.quiz-btn:disabled { opacity: .4; cursor: not-allowed; }
.quiz-unlock-note { text-align: center; font-size: 12px; color: var(--text2); margin-top: 8px; }

#lesson { max-width: 720px; margin: 0 auto; width: 100%; padding: 24px 20px 40px; flex-direction: column; }
.back-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 0; display: flex; align-items: center; gap: 6px; margin-bottom: 24px; transition: color .15s; }
.back-btn:hover { color: var(--text); }
.lesson-header { margin-bottom: 24px; }
.lesson-stage-tag { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.lesson-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.lesson-progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-top: 16px; }
.lesson-progress-fill { height: 100%; border-radius: 2px; transition: width .4s; }
.tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--bg2); padding: 4px; border-radius: 10px; }
.tab-btn { flex: 1; padding: 9px; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; background: none; color: var(--text2); transition: all .2s; }
.tab-btn.active { background: var(--bg4); color: var(--text); }
.explain-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; font-size: 14px; line-height: 1.7; color: var(--text2); }
.explain-box strong { color: var(--text); }
.examples-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.example-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.speak-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--accent); font-size: 16px; flex-shrink: 0; transition: all .15s; }
.speak-btn:hover { background: var(--accent); color: var(--bg); }
.example-text { flex: 1; }
.ex-written { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.ex-arrow { color: var(--text2); margin: 0 4px; }
.ex-spoken { color: var(--accent); font-style: italic; font-size: 15px; }
.ex-note { font-size: 12px; color: var(--text2); margin-top: 4px; }
.start-practice-btn { width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s; color: var(--bg); }
.start-practice-btn:hover { opacity: .9; }
.ex-counter { font-size: 12px; color: var(--text2); font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; }
.question-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 20px; }
.question-label { font-size: 11px; color: var(--text2); font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
.question-text { font-size: 17px; font-weight: 500; line-height: 1.5; }
.options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.option-btn { background: var(--bg2); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: left; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--text); transition: all .18s; display: flex; align-items: center; gap: 12px; }
.option-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--bg3); }
.option-btn.correct { border-color: var(--green); background: rgba(61,220,132,.12); color: var(--green); }
.option-btn.wrong { border-color: var(--accent3); background: rgba(255,107,107,.12); color: var(--accent3); }
.option-btn:disabled { cursor: default; }
.opt-letter { width: 26px; height: 26px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; color: var(--text2); }
.option-btn.correct .opt-letter { background: var(--green); color: var(--bg); }
.option-btn.wrong .opt-letter { background: var(--accent3); color: var(--bg); }
.feedback-box { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; display: none; }
.feedback-box.show { display: block; }
.feedback-box.correct-fb { border: 1px solid var(--green); color: var(--green); }
.feedback-box.wrong-fb { border: 1px solid var(--accent3); color: var(--text); }
.feedback-label { font-weight: 700; margin-bottom: 4px; }
.next-btn { width: 100%; padding: 14px; border-radius: var(--radius); border: none; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: none; color: var(--bg); transition: opacity .2s; }
.next-btn.show { display: block; }
.next-btn:hover { opacity: .9; }
.stage-complete { text-align: center; padding: 40px 20px; display: none; }
.stage-complete.show { display: block; }
.complete-icon { font-size: 60px; margin-bottom: 16px; }
.complete-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 8px; }
.complete-score { font-size: 15px; color: var(--text2); margin-bottom: 28px; }
.complete-btns { display: flex; flex-direction: column; gap: 10px; max-width: 280px; margin: 0 auto; }
.complete-btns button { padding: 13px; border-radius: var(--radius); border: none; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
.complete-btns button:hover { opacity: .85; }

#quiz { max-width: 720px; margin: 0 auto; width: 100%; padding: 24px 20px 40px; }
.quiz-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
.quiz-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; flex: 1; }
.quiz-score-badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.quiz-progress { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
.quiz-progress-fill { height: 100%; background: var(--accent2); border-radius: 2px; transition: width .4s; }
.quiz-stage-tag { font-size: 11px; color: var(--text2); font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }

#results { max-width: 560px; margin: 0 auto; width: 100%; padding: 48px 20px; text-align: center; }
.results-icon { font-size: 70px; margin-bottom: 20px; }
.results-title { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 8px; }
.results-sub { font-size: 15px; color: var(--text2); margin-bottom: 32px; line-height: 1.6; }
.score-ring { width: 140px; height: 140px; margin: 0 auto 32px; position: relative; display: flex; align-items: center; justify-content: center; }
.score-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
.score-ring-inner { text-align: center; }
.score-pct { font-family: 'Syne', sans-serif; font-size: 34px; font-weight: 800; }
.score-label { font-size: 12px; color: var(--text2); font-weight: 600; }
.results-breakdown { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 28px; text-align: left; }
.breakdown-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 14px; }
.breakdown-row + .breakdown-row { border-top: 1px solid var(--border); }
.breakdown-stage { color: var(--text2); }
.breakdown-score { font-weight: 600; }
.results-btns { display: flex; flex-direction: column; gap: 10px; }
.results-btns button { padding: 14px; border-radius: var(--radius); border: none; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
.results-btns button:hover { opacity: .85; }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="password-screen">
  <div class="pw-box">
    <div class="pw-icon">🎙️</div>
    <div class="pw-title">Connected<br><span>Speech Lab</span></div>
    <p class="pw-sub">Enter your access code to continue</p>
    <div class="pw-label">Access Code</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="••••••••" maxlength="20" autocomplete="off" />
    <button class="pw-btn" onclick="checkPassword()">Enter →</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div id="home" class="screen active">
  <div class="home-header">
    <div class="logo-tag">ESL · PHONOLOGY</div>
    <h1 class="home-title">Connected<br><span>Speech Lab</span></h1>
    <p class="home-sub">Master the sounds of natural English — one stage at a time.</p>
  </div>
  <p class="section-label">Choose Your Stage</p>
  <div class="stages-grid" id="stagesGrid"></div>
  <button class="quiz-btn" id="quizBtn" onclick="startQuiz()">⚡ Take the Quiz</button>
  <p class="quiz-unlock-note" id="quizNote"></p>
</div>

<div id="lesson" class="screen">
  <button class="back-btn" onclick="goHome()">← Back to Stages</button>
  <div class="lesson-header">
    <div class="lesson-stage-tag" id="lessonStageTag"></div>
    <h2 class="lesson-title" id="lessonTitle"></h2>
    <div class="lesson-progress-bar"><div class="lesson-progress-fill" id="lessonProgressFill"></div></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabLearn" onclick="switchTab('learn')">📖 Learn</button>
    <button class="tab-btn" id="tabPractice" onclick="switchTab('practice')">✏️ Practice</button>
  </div>
  <div id="learnTab">
    <div class="explain-box" id="explainBox"></div>
    <p class="section-label">Examples</p>
    <div class="examples-list" id="examplesList"></div>
    <button class="start-practice-btn" id="startPracticeBtn" onclick="switchTab('practice')">Start Practice →</button>
  </div>
  <div id="practiceTab" style="display:none">
    <div class="exercise-wrap" id="exerciseWrap">
      <div class="ex-counter" id="exCounter"></div>
      <div class="question-box">
        <div class="question-label">Question</div>
        <div class="question-text" id="questionText"></div>
      </div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box" id="feedbackBox">
        <div class="feedback-label" id="feedbackLabel"></div>
        <div id="feedbackText"></div>
      </div>
      <button class="next-btn" id="nextBtn" onclick="nextExercise()">Next Question →</button>
    </div>
    <div class="stage-complete" id="stageComplete">
      <div class="complete-icon" id="completeIcon"></div>
      <h3 class="complete-title" id="completeTitle"></h3>
      <p class="complete-score" id="completeScore"></p>
      <div class="complete-btns">
        <button id="nextStageBtn" onclick="goNextStage()" style="background:var(--accent);color:var(--bg)">Next Stage →</button>
        <button onclick="switchTab('learn')" style="background:var(--bg3);color:var(--text);border:1px solid var(--border)">Review Lesson</button>
        <button onclick="goHome()" style="background:var(--bg2);color:var(--text2)">Back to Stages</button>
      </div>
    </div>
  </div>
</div>

<div id="quiz" class="screen">
  <button class="back-btn" onclick="goHome()">← Back to Stages</button>
  <div class="quiz-header">
    <h2 class="quiz-title">⚡ Quick Quiz</h2>
    <div class="quiz-score-badge" id="quizScoreBadge">Score: 0</div>
  </div>
  <div class="quiz-progress"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
  <div class="quiz-stage-tag" id="quizStageTag"></div>
  <div class="question-box">
    <div class="question-label">Question</div>
    <div class="question-text" id="quizQuestion"></div>
  </div>
  <div class="options-grid" id="quizOptions"></div>
  <div class="feedback-box" id="quizFeedback">
    <div class="feedback-label" id="quizFeedbackLabel"></div>
    <div id="quizFeedbackText"></div>
  </div>
  <button class="next-btn" id="quizNextBtn" onclick="nextQuizQ()">Next Question →</button>
</div>

<div id="results" class="screen">
  <div class="results-icon" id="resultsIcon"></div>
  <h2 class="results-title" id="resultsTitle"></h2>
  <p class="results-sub" id="resultsSub"></p>
  <div class="score-ring">
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="60" fill="none" stroke="#1f2a3c" stroke-width="10"/>
      <circle id="scoreArc" cx="70" cy="70" r="60" fill="none" stroke="#ffd60a" stroke-width="10" stroke-dasharray="0 377" stroke-linecap="round"/>
    </svg>
    <div class="score-ring-inner">
      <div class="score-pct" id="scorePct"></div>
      <div class="score-label">SCORE</div>
    </div>
  </div>
  <div class="results-breakdown" id="resultsBreakdown"></div>
  <div class="results-btns">
    <button onclick="startQuiz()" style="background:var(--accent2);color:var(--bg)">Try Again</button>
    <button onclick="goHome()" style="background:var(--bg3);color:var(--text)">Back to Stages</button>
  </div>
</div>
</div>

<script>
// ── PASSWORD ──────────────────────────────────────────────────────────────────
const CORRECT_PASSWORD = 'KSL2027';

function checkPassword() {
  const val = document.getElementById('pw-input').value;
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  if (val === CORRECT_PASSWORD) {
    document.getElementById('password-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderHome();
  } else {
    errEl.textContent = 'Incorrect code. Please try again.';
    input.classList.add('shake');
    input.value = '';
    setTimeout(() => input.classList.remove('shake'), 500);
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

// ── DATA ──────────────────────────────────────────────────────────────────────
const STAGE_COLORS = ['#00d4ff','#ffd60a','#ff6b6b','#3ddc84','#c084fc','#fb923c','#34d399','#f472b6','#60a5fa'];

const stages = [
  {
    id: 1, title: "Weak Forms", icon: "🔉", desc: "Function words reduced in natural speech",
    explanation: `In natural English, <strong>function words</strong> (articles, prepositions, conjunctions, auxiliaries) are rarely stressed. Instead, they shrink into quieter, shorter <strong>weak forms</strong> using the schwa /ə/ sound. This is one of the most common features of connected speech.`,
    examples: [
      { written: "fish and chips", spoken: "fish ən chips", note: "'and' → /ən/" },
      { written: "I want to go", spoken: "I wənt tə go", note: "'to' → /tə/" },
      { written: "I can do it", spoken: "I kən do it", note: "'can' → /kən/" },
      { written: "a cup of tea", spoken: "ə cup əv tea", note: "'a' → /ə/,  'of' → /əv/" },
      { written: "are you ready?", spoken: "ə you ready?", note: "'are' → /ə/" },
    ],
    exercises: [
      { q: "How is 'and' usually pronounced in 'bread and butter'?", opts: ["bread AND butter", "bread ən butter", "bread ann butter", "bread n butter"], correct: 1, exp: "'and' becomes /ən/ — the vowel reduces to a schwa in unstressed position." },
      { q: "Which sentence correctly shows the weak form of 'to'?", opts: ["I want TO see you", "I want tuh see you", "I wənt tə see you", "I wanna see you (this is elision)"], correct: 2, exp: "'to' reduces to /tə/ before a consonant. The vowel becomes an unstressed schwa." },
      { q: "What happens to 'can' in: 'She can swim really well'?", opts: ["It stays as /kæn/", "It becomes /kən/", "It becomes /kun/", "It is dropped completely"], correct: 1, exp: "'can' reduces to /kən/ — the strong vowel /æ/ becomes a schwa when unstressed." },
      { q: "In 'a cup of tea', how many weak forms are there?", opts: ["None", "One ('a')", "Two ('a' and 'of')", "Three"], correct: 2, exp: "Both 'a' (/ə/) and 'of' (/əv/) use weak forms. These are extremely common in everyday speech." },
      { q: "Which word is NOT commonly used in a weak form?", opts: ["the", "and", "run", "can"], correct: 2, exp: "'run' is a content word (verb) — it carries meaning and is typically stressed. Function words like 'the', 'and', 'can' are commonly weakened." },
    ]
  },
  {
    id: 2, title: "Contractions", icon: "✂️", desc: "Subject + auxiliary blended together",
    explanation: `<strong>Contractions</strong> combine a subject or auxiliary verb with another word, dropping letters and replacing them with an apostrophe. They are extremely common in spoken English and make speech sound more natural and fluent. Using full forms can sound formal or even unnatural in conversation.`,
    examples: [

// ── STATE ──────────────────────────────────────────────────────────────────────
let progress = JSON.parse(localStorage.getItem('cs_progress') || '{}');
let currentStage = null, currentTab = 'learn', currentExIdx = 0, exerciseScore = 0, answered = false;
let quizQuestions = [], quizIdx = 0, quizScore = 0, quizBreakdown = {};

function saveProgress() { localStorage.setItem('cs_progress', JSON.stringify(progress)); }
function isUnlocked(id) { return id === 1 || (progress[id-1] && progress[id-1].completed); }
function completedCount() { return Object.values(progress).filter(p => p.completed).length; }
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[·\/\|]/g, ' '));
  u.rate = 0.85; u.lang = 'en-GB'; speechSynthesis.speak(u);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderHome() {
  const grid = document.getElementById('stagesGrid'); grid.innerHTML = '';
  stages.forEach((s, i) => {
    const unlocked = isUnlocked(s.id), done = progress[s.id] && progress[s.id].completed, color = STAGE_COLORS[i];
    const card = document.createElement('div');
    card.className = 'stage-card' + (unlocked ? '' : ' locked') + (done ? ' completed' : '');
    card.style.setProperty('--card-color', color);
    card.innerHTML = `${!unlocked ? '<span class="stage-lock">🔒</span>' : ''}<div class="stage-num">STAGE ${s.id}</div><div class="stage-name">${s.icon} ${s.title}</div><div class="stage-desc">${s.desc}</div>`;
    if (unlocked) card.onclick = () => openStage(s.id);
    grid.appendChild(card);
  });
  const done = completedCount();
  const quizBtn = document.getElementById('quizBtn');
  quizBtn.disabled = done === 0;
  document.getElementById('quizNote').textContent = done === 0 ? 'Complete at least 1 stage to unlock the quiz' : `Quiz covers ${done} stage${done > 1 ? 's' : ''} — complete more stages for more questions!`;
}

function goHome() { renderHome(); showScreen('home'); }

function openStage(stageId) {
  currentStage = stages.find(s => s.id === stageId);
  currentExIdx = 0; exerciseScore = 0; answered = false; currentTab = 'learn';
  renderLesson(); switchTab('learn'); showScreen('lesson');
}

function renderLesson() {
  const s = currentStage, color = STAGE_COLORS[s.id - 1];
  document.getElementById('lessonStageTag').textContent = `STAGE ${s.id}`;
  document.getElementById('lessonStageTag').style.color = color;
  document.getElementById('lessonTitle').textContent = `${s.icon} ${s.title}`;
  document.getElementById('lessonProgressFill').style.background = color;
  document.getElementById('lessonProgressFill').style.width = '0%';
  document.getElementById('startPracticeBtn').style.background = color;
  document.getElementById('explainBox').innerHTML = s.explanation;
  const list = document.getElementById('examplesList'); list.innerHTML = '';
  s.examples.forEach(ex => {
    const card = document.createElement('div'); card.className = 'example-card';
    card.innerHTML = `<button class="speak-btn" onclick="speak('${ex.written.replace(/'/g,"\\'")}')">🔊</button><div class="example-text"><div class="ex-written">${ex.written}<span class="ex-arrow"> → </span><span class="ex-spoken">${ex.spoken}</span></div><div class="ex-note">${ex.note}</div></div>`;
    list.appendChild(card);
  });
  renderExercise();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabLearn').className = 'tab-btn' + (tab === 'learn' ? ' active' : '');
  document.getElementById('tabPractice').className = 'tab-btn' + (tab === 'practice' ? ' active' : '');
  document.getElementById('learnTab').style.display = tab === 'learn' ? 'block' : 'none';
  document.getElementById('practiceTab').style.display = tab === 'practice' ? 'block' : 'none';
  if (tab === 'practice') {
    const done = currentExIdx >= currentStage.exercises.length;
    document.getElementById('exerciseWrap').style.display = done ? 'none' : 'block';
    document.getElementById('stageComplete').className = 'stage-complete' + (done ? ' show' : '');
  }
}

function renderExercise() {
  const s = currentStage, color = STAGE_COLORS[s.id - 1], total = s.exercises.length;
  if (currentExIdx >= total) {
    document.getElementById('exerciseWrap').style.display = 'none';
    document.getElementById('stageComplete').className = 'stage-complete show';
    const pct = Math.round((exerciseScore / total) * 100);
    document.getElementById('completeIcon').textContent = pct >= 80 ? '🏆' : pct >= 60 ? '✅' : '📚';
    document.getElementById('completeTitle').textContent = pct >= 80 ? 'Excellent work!' : pct >= 60 ? 'Good effort!' : 'Keep practising!';
    document.getElementById('completeScore').textContent = `You scored ${exerciseScore} out of ${total} (${pct}%)`;
    const prev = progress[s.id] || {};
    progress[s.id] = { completed: true, bestScore: Math.max(prev.bestScore || 0, exerciseScore), totalEx: total };
    saveProgress();
    const nextBtn = document.getElementById('nextStageBtn');
    const nextStage = stages.find(st => st.id === s.id + 1);
    if (nextStage) { nextBtn.textContent = `Next: ${nextStage.title} →`; nextBtn.style.display = 'block'; }
    else { nextBtn.textContent = 'All stages complete! 🎉'; nextBtn.onclick = goHome; }
    return;
  }
  document.getElementById('lessonProgressFill').style.width = `${(currentExIdx / total) * 100}%`;
  const ex = s.exercises[currentExIdx];
  document.getElementById('exCounter').textContent = `QUESTION ${currentExIdx + 1} OF ${total}`;
  document.getElementById('questionText').textContent = ex.q;
  answered = false;
  const grid = document.getElementById('optionsGrid'); grid.innerHTML = '';
  ex.opts.forEach((opt, i) => {
    const btn = document.createElement('button'); btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${'ABCD'[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i, btn); grid.appendChild(btn);
  });
  const fb = document.getElementById('feedbackBox'); fb.className = 'feedback-box';
  document.getElementById('feedbackLabel').textContent = ''; document.getElementById('feedbackText').textContent = '';
  const nb = document.getElementById('nextBtn'); nb.className = 'next-btn';
  nb.style.background = color; nb.style.color = 'var(--bg)';
  nb.textContent = currentExIdx < total - 1 ? 'Next Question →' : 'See Results →';
}

function selectAnswer(idx, btn) {
  if (answered) return; answered = true;
  const ex = currentStage.exercises[currentExIdx];
  const isCorrect = idx === ex.correct;
  if (isCorrect) exerciseScore++;
  document.querySelectorAll('.option-btn').forEach((b, i) => { b.disabled = true; if (i === ex.correct) b.classList.add('correct'); else if (i === idx && !isCorrect) b.classList.add('wrong'); });
  const fb = document.getElementById('feedbackBox');
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  document.getElementById('feedbackLabel').textContent = isCorrect ? '✓ Correct!' : '✗ Not quite.';
  document.getElementById('feedbackText').textContent = ex.exp;
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextExercise() { currentExIdx++; renderExercise(); }
function goNextStage() { const next = stages.find(s => s.id === currentStage.id + 1); if (next) openStage(next.id); else goHome(); }

function startQuiz() {
  quizQuestions = []; quizBreakdown = {};
  stages.forEach(s => {
    if (progress[s.id] && progress[s.id].completed) {
      s.exercises.forEach(ex => quizQuestions.push({ ...ex, stageTitle: s.title, stageColor: STAGE_COLORS[s.id - 1] }));
      quizBreakdown[s.title] = { correct: 0, total: 0 };
    }
  });
  quizQuestions.sort(() => Math.random() - .5);
  if (quizQuestions.length > 20) quizQuestions = quizQuestions.slice(0, 20);
  quizIdx = 0; quizScore = 0; answered = false;
  showScreen('quiz'); renderQuizQ();
}

function renderQuizQ() {
  if (quizIdx >= quizQuestions.length) { showResults(); return; }
  const q = quizQuestions[quizIdx], total = quizQuestions.length;
  document.getElementById('quizProgressFill').style.width = `${(quizIdx / total) * 100}%`;
  document.getElementById('quizScoreBadge').textContent = `Score: ${quizScore}/${quizIdx}`;
  document.getElementById('quizStageTag').textContent = `STAGE: ${q.stageTitle}`;
  document.getElementById('quizStageTag').style.color = q.stageColor;
  document.getElementById('quizQuestion').textContent = q.q;
  answered = false;
  const grid = document.getElementById('quizOptions'); grid.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button'); btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${'ABCD'[i]}</span>${opt}`;
    btn.onclick = () => selectQuizAnswer(i, btn); grid.appendChild(btn);
  });
  const fb = document.getElementById('quizFeedback'); fb.className = 'feedback-box';
  document.getElementById('quizFeedbackLabel').textContent = ''; document.getElementById('quizFeedbackText').textContent = '';
  const nb = document.getElementById('quizNextBtn'); nb.className = 'next-btn';
  nb.style.background = 'var(--accent2)'; nb.style.color = 'var(--bg)';
  nb.textContent = quizIdx < quizQuestions.length - 1 ? 'Next Question →' : 'See Results →';
}

function selectQuizAnswer(idx, btn) {
  if (answered) return; answered = true;
  const q = quizQuestions[quizIdx], isCorrect = idx === q.correct;
  if (isCorrect) { quizScore++; if (quizBreakdown[q.stageTitle]) quizBreakdown[q.stageTitle].correct++; }
  if (quizBreakdown[q.stageTitle]) quizBreakdown[q.stageTitle].total++;
  document.querySelectorAll('#quizOptions .option-btn').forEach((b, i) => { b.disabled = true; if (i === q.correct) b.classList.add('correct'); else if (i === idx && !isCorrect) b.classList.add('wrong'); });
  const fb = document.getElementById('quizFeedback');
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  document.getElementById('quizFeedbackLabel').textContent = isCorrect ? '✓ Correct!' : '✗ Not quite.';
  document.getElementById('quizFeedbackText').textContent = q.exp;
  document.getElementById('quizNextBtn').className = 'next-btn show';
}

function nextQuizQ() { quizIdx++; renderQuizQ(); }

function showResults() {
  const total = quizQuestions.length, pct = total > 0 ? Math.round((quizScore / total) * 100) : 0;
  const circumference = 2 * Math.PI * 60;
  document.getElementById('resultsIcon').textContent = pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : '📚';
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Outstanding!' : pct >= 60 ? 'Good work!' : 'Keep going!';
  document.getElementById('resultsSub').textContent = `You scored ${quizScore} out of ${total} questions (${pct}%). ` + (pct >= 80 ? 'You have a strong grasp of connected speech!' : pct >= 60 ? 'Review the stages you found tricky.' : 'Go back to the lessons and practise more.');
  document.getElementById('scorePct').textContent = pct + '%';
  const arc = document.getElementById('scoreArc'), fill = (pct / 100) * circumference;
  arc.setAttribute('stroke-dasharray', `${fill} ${circumference - fill}`);
  arc.setAttribute('stroke', pct >= 80 ? '#3ddc84' : pct >= 60 ? '#ffd60a' : '#ff6b6b');
  const bd = document.getElementById('resultsBreakdown');
  bd.innerHTML = '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;letter-spacing:1px">STAGE BREAKDOWN</div>';
  Object.entries(quizBreakdown).forEach(([stage, data]) => {
    const p = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
    const row = document.createElement('div'); row.className = 'breakdown-row';
    row.innerHTML = `<span class="breakdown-stage">${stage}</span><span class="breakdown-score" style="color:${p>=80?'var(--green)':p>=60?'var(--accent2)':'var(--accent3)'}">${data.correct}/${data.total} (${p}%)</span>`;
    bd.appendChild(row);
  });
  showScreen('results');
}
</script>
</body>
</html>
